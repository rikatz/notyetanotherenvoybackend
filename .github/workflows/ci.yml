name: Pull Request Tests

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# Minimal permissions - only what's needed
permissions:
  contents: read

# Prevent concurrent runs on same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Security vulnerability scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
          check-latest: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Scan each module in the workspace
          for dir in client examples nginxbackend; do
            echo "Running govulncheck in $dir"
            (cd $dir && govulncheck ./...)
          done

  # Build and test Go code
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
          check-latest: true

      - name: Verify Go modules
        run: |
          go work sync
          # Verify each module in the workspace
          for dir in client examples nginxbackend; do
            echo "Verifying modules in $dir"
            (cd $dir && go mod verify)
          done

      - name: Run go vet
        run: |
          # Vet each module in the workspace
          for dir in client examples nginxbackend; do
            echo "Running go vet in $dir"
            (cd $dir && go vet ./...)
          done

      - name: Run tests with race detector
        run: |
          cd client
          go test -v -race -timeout 5m ./...

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o nginx-controller ./nginxbackend/main.go

      - name: Verify binary
        run: |
          file nginx-controller
          ./nginx-controller --version || echo "Binary created successfully"

  # Build container image
  build-image:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: false
          load: true
          tags: localhost/nginx-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

